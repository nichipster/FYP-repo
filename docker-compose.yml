version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nutritrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: nutritrack_pass
      POSTGRES_DB: nutritrack
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutritrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutritrack_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nutritrack:nutritrack_pass@nutritrack_db:5432/nutritrack
      JWT_SECRET: change_me_in_production_use_a_long_random_string
      ADMIN_CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./fyp-project
      dockerfile: Dockerfile
    container_name: nutritrack_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://nutritrack_backend:8000

volumes:
  pg_data:
